# Project-wide Gradle settings.

# JVM memory (reduced to avoid crashes on low-RAM systems)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Disable Gradle daemon to avoid daemon crash issues
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true

# React Native architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Disable NEW architecture (important for stability)
newArchEnabled=false

# Hermes JS engine (keep enabled – good)
hermesEnabled=true

# Edge to edge
edgeToEdgeEnabled=false